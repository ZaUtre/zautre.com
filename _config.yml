# Zautre.com Configuration
title: ZaUtre
email: office@zautre.com
tagline: Fast storefronts. Faster delivery.
description: >-
  ZaUtre is a senior Salesforce Commerce Cloud (SFCC) engineering team for retail
  and luxury brands: architecture, development, performance engineering and QA.
  Builders of Tokenwright, AI-accelerated SFCC delivery.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://zautre.com" # the base hostname & protocol for your site
phone: "+359878899569"
address: "84 Cherni Vrah Blvd., fl. 5, 1407 Sofia, Bulgaria"
github_username: zautre
linkedin_username: zautre

# SEO / Social
twitter:
  username: zautre
  card: summary_large_image

social:
  name: ZaUtre
  links:
    - https://www.linkedin.com/company/zautre
    - https://github.com/zautre

logo: /assets/images/zautre-logo.png

# Build settings
markdown: kramdown
theme: minima
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation Structure
header_pages:
  - services.md
  - projects.md
  - tokenwright.md
  - about.md
  - careers.md
  - blog.md

# Collections
collections:
  services:
    output: true
    permalink: /:collection/:name/
  projects:
    output: true
    permalink: /:collection/:name/
  team:
    output: false

# Default social share image (overridden by `image:` in front matter)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og/zautre.jpg

# Exclude from processing
exclude:
  - CLAUDE.md
  - README.md
  - package-lock.json
  - hero.mp4
  - assets/images/hero-poster.png
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - requirements.md
  - jekyll-temp/