<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.meta_title %}{{ page.meta_title }}{% elsif page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="theme-color" content="#07080a">
  <meta name="color-scheme" content="dark">
  <link rel="preload" href="{{ '/assets/fonts/geist-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} News" href="{{ '/feed.xml' | relative_url }}">
  {% seo title=false %}
  <script>document.documentElement.className=document.documentElement.className.replace('no-js','js')</script>
</head>
<body class="{% if page.layout %}layout-{{ page.layout }}{% endif %}{% if page.class %} {{ page.class }}{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include announcement.html %}
  {% include header.html %}

  <main id="main" class="site-main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {% include analytics.html %}
</body>
</html>
